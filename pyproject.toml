[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-ai"
version = "1.0.0"
description = "Automatic screen chessboard detection with Stockfish analysis shown in a transparent overlay"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chess AI contributors" }]
dependencies = [
    "python-chess>=1.10",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "mss>=9.0",
    "PyQt5>=5.15",
    "pynput>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
build = ["pyinstaller>=6.0"]

[project.scripts]
chess-ai = "chess_ai.run:main"

[tool.setuptools.packages.find]
include = ["chess_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
